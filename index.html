<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANUAR NYSE — Cotización del día</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Lora:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{ margin:0; min-height:100vh; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 16px; gap:18px; }
  #stage{ width:min(94vw,560px); aspect-ratio:1/1; }
  #stage svg{ width:100%; height:100%; display:block; }

  .tagline{
    font-family:'Lora',serif; font-style:italic; font-weight:500; font-size:13px;
    color:#F5F1E8; opacity:.75; letter-spacing:.02em; text-align:center;
  }

  .wa-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:fit-content; padding:10px 18px; border-radius:10px;
    background:#25D366;
    color:#0b1a0e; text-decoration:none;
    font-family:'Poppins',sans-serif; font-weight:600; font-size:14px; letter-spacing:.02em;
    box-shadow:0 8px 22px rgba(0,0,0,.4);
  }
  .wa-btn svg{ width:17px; height:17px; flex:0 0 auto; }
  .wa-btn:active{ filter:brightness(0.95); }
</style>
</head>
<body>
  <div class="tagline">Desde el año 2021 en el mercado bursátil</div>

  <div id="stage"></div>

  <a class="wa-btn" href="https://wa.me/5491140807055?text=Hola%2C%20quiero%20consultar%20por%20un%20cambio" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.51 2 12.04 2zm5.83 14.06c-.24.68-1.4 1.3-1.93 1.38-.5.08-1.12.11-1.81-.11-.42-.13-.95-.31-1.64-.6-2.88-1.24-4.76-4.15-4.9-4.34-.14-.19-1.17-1.56-1.17-2.98s.73-2.11 1-2.4c.26-.29.57-.36.76-.36s.38.002.55.01c.18.008.41-.07.64.49.24.58.81 2 .88 2.15.07.15.12.32.02.51-.1.19-.15.31-.29.48-.15.17-.31.38-.44.51-.15.15-.3.31-.13.6.17.29.75 1.24 1.62 2.01 1.11.99 2.04 1.3 2.34 1.44.3.15.47.13.65-.08.18-.21.75-.87.95-1.17.2-.3.4-.25.66-.15.27.1 1.71.81 2 .96.29.15.48.22.55.34.07.13.07.75-.17 1.43z"/></svg>
    <span>Escribinos por WhatsApp</span>
  </a>

  <script>
// ANUAR NYSE — shared render logic

const BANKS = [
  { name: "Pichincha",     color: "#FFC72C" },
  { name: "Guayaquil",     color: "#E6007E" },
  { name: "Internacional", color: "#FFC72C" },
  { name: "Pacífico",      color: "#1565C0" },
  { name: "Bolivariano",   color: "#2FB6A6" },
];

const ALL_BANKS_MAIN = {
  pichincha:     { name: "Pichincha",     color: "#FFC72C" },
  guayaquil:     { name: "Guayaquil",     color: "#E6007E" },
  internacional: { name: "Internacional", color: "#FFC72C" },
  pacifico:      { name: "Pacífico",      color: "#1565C0" },
  bolivariano:   { name: "Bolivariano",   color: "#2FB6A6" },
};
const DEFAULT_MAIN_BANKS = ['pichincha','guayaquil','internacional','pacifico','bolivariano'];

const MESES_ES = ["enero","febrero","marzo","abril","mayo","junio","julio",
  "agosto","septiembre","octubre","noviembre","diciembre"];

function todayLabel(){
  const d = new Date();
  return new Intl.DateTimeFormat('es-AR', { day: 'numeric', month: 'long', timeZone: 'America/Argentina/Buenos_Aires' }).format(d);
}

function formatARS(raw){
  const digits = String(raw || '').replace(/[^\d]/g,'');
  if(!digits) return '$0';
  return '$' + digits.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

function bankIcon(x, y, color){
  return `
    <g transform="translate(${x},${y})" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-9,-8 L0,-13 L9,-8 Z" fill="${color}" stroke="none"/>
      <line x1="-9" y1="-8" x2="-9" y2="6"/>
      <line x1="-4.3" y1="-8" x2="-4.3" y2="6"/>
      <line x1="4.3" y1="-8" x2="4.3" y2="6"/>
      <line x1="9" y1="-8" x2="9" y2="6"/>
      <line x1="-11" y1="6" x2="11" y2="6"/>
      <line x1="-11" y1="9" x2="11" y2="9"/>
    </g>`;
}

function bankChip(x, y, bank){
  return `
    <g transform="translate(${x},${y})">
      ${bankIcon(0,0,bank.color)}
      <text x="18" y="6" text-anchor="start" font-family="Poppins" font-weight="400" font-size="24" fill="#F5F1E8">${bank.name}</text>
    </g>`;
}

// Dynamically measure each bank name so rows stay centered regardless of selection
function measureTextWidthMain(text, font){
  if (typeof document === 'undefined') return text.length * 12.5;
  const canvas = measureTextWidthMain._c || (measureTextWidthMain._c = document.createElement('canvas'));
  const ctx = canvas.getContext('2d');
  ctx.font = font;
  return ctx.measureText(text).width;
}

function layoutMainBankRow(bankObjs){
  const gap = 40, iconLeft = 11, textStart = 18;
  const widths = bankObjs.map(b => iconLeft + textStart + measureTextWidthMain(b.name, '400 24px Poppins'));
  const total = widths.reduce((a,w) => a + w, 0) + gap * Math.max(0, bankObjs.length - 1);
  let cursor = -total / 2;
  const positions = [];
  widths.forEach(w => {
    positions.push(cursor + iconLeft);
    cursor += w + gap;
  });
  return positions;
}

function rateBlock(compraStr, ventaStr){
  return `
    <text x="-170" y="-52" text-anchor="middle" font-family="Poppins" font-weight="600" font-size="17" letter-spacing="5" fill="#C9A227">COMPRA</text>
    <text x="-170" y="6" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="64" fill="url(#goldFoil)">${compraStr}</text>
    <line x1="0" y1="-52" x2="0" y2="16" stroke="#6b5f45" stroke-width="1.5"/>
    <text x="170" y="-52" text-anchor="middle" font-family="Poppins" font-weight="600" font-size="17" letter-spacing="5" fill="#C9A227">VENTA</text>
    <text x="170" y="6" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="64" fill="url(#goldFoil)">${ventaStr}</text>`;
}

function buildSVG({ rate, percent, noComision, banks }){
  const pct = (percent === undefined || percent === null || percent === '') ? 3 : parseFloat(percent);
  const compraStr = formatARS(rate);
  const ventaNum = Math.round(parseInt(String(rate||'0').replace(/[^\d]/g,''),10) * (1 + pct/100));
  const ventaStr = formatARS(ventaNum);
  const dateStr = todayLabel();

  const bankKeys = (banks && banks.length) ? banks : DEFAULT_MAIN_BANKS;
  const bankObjs = bankKeys.map(k => ALL_BANKS_MAIN[k]).filter(Boolean);
  let bankRowsSVG = '';
  if(bankObjs.length <= 3){
    const pos = layoutMainBankRow(bankObjs);
    bankRowsSVG = `<g transform="translate(540,909)">${bankObjs.map((b,i)=>bankChip(pos[i],0,b)).join('')}</g>`;
  } else {
    const split = Math.ceil(bankObjs.length / 2);
    const row1Banks = bankObjs.slice(0, split);
    const row2Banks = bankObjs.slice(split);
    const pos1 = layoutMainBankRow(row1Banks);
    const pos2 = layoutMainBankRow(row2Banks);
    bankRowsSVG = `<g transform="translate(540,884)">${row1Banks.map((b,i)=>bankChip(pos1[i],0,b)).join('')}</g>
  <g transform="translate(540,934)">${row2Banks.map((b,i)=>bankChip(pos2[i],0,b)).join('')}</g>`;
  }

  return `
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#141210"/>
      <stop offset="55%" stop-color="#0a0908"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D98B"/>
      <stop offset="30%" stop-color="#C9A227"/>
      <stop offset="55%" stop-color="#F6E3A1"/>
      <stop offset="80%" stop-color="#B8901E"/>
      <stop offset="100%" stop-color="#E8C468"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a6c1a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E8C468"/>
      <stop offset="100%" stop-color="#8a6c1a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bgGlow)"/>
  <rect x="66" y="66" width="948" height="948" fill="none" stroke="#B8901E" stroke-width="1.5" opacity="0.55"/>
  <rect x="78" y="78" width="924" height="924" fill="none" stroke="#E8C468" stroke-width="1" opacity="0.35"/>
  <g stroke="#E8C468" stroke-width="2" opacity="0.8">
    <path d="M66 110 L66 66 L110 66"/>
    <path d="M970 66 L1014 66 L1014 110"/>
    <path d="M1014 970 L1014 1014 L970 1014"/>
    <path d="M110 1014 L66 1014 L66 970"/>
  </g>

  <text x="540" y="200" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="66" letter-spacing="8" fill="url(#goldFoil)">ANUAR</text>
  <line x1="140" y1="240" x2="940" y2="240" stroke="url(#goldLine)" stroke-width="1"/>

  <text x="540" y="264" text-anchor="middle" font-family="Lora" font-style="italic" font-weight="500" font-size="27" letter-spacing="2" fill="#C9A227">Cotización · ${dateStr}</text>

  <text x="540" y="352" text-anchor="middle" font-family="Poppins" font-weight="600" font-size="25" letter-spacing="4" fill="#F5F1E8">DÓLAR ECUADOR</text>
  <g transform="translate(540,432)">
    ${rateBlock(compraStr, ventaStr)}
  </g>

  <text x="540" y="522" text-anchor="middle" font-family="Poppins" font-weight="500" font-size="27" fill="#F5F1E8">Transferimos DOLARES a Argentina 🇦🇷</text>
  <text x="540" y="560" text-anchor="middle" font-family="Poppins" font-weight="500" font-size="27" fill="#F5F1E8">y recibimos DOLARES en Ecuador 🇪🇨</text>
  <text x="540" y="604" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="34" letter-spacing="4" fill="url(#goldFoil)">1=1</text>

  ${noComision ? `<text x="540" y="644" text-anchor="middle" font-family="Poppins" font-weight="600" font-size="24" letter-spacing="9" fill="#E8C468">SIN COMISIONES</text>` : ``}

  <g transform="translate(540,682)" stroke="#E8C468" stroke-width="1.5" fill="none" opacity="0.85">
    <rect x="-8" y="-8" width="16" height="16" transform="rotate(45)"/>
    <line x1="-140" y1="0" x2="-24" y2="0"/>
    <line x1="24" y1="0" x2="140" y2="0"/>
  </g>

  <text x="540" y="742" text-anchor="middle" font-family="Poppins" font-weight="500" font-size="28" fill="#F5F1E8">En Argentina trabajamos con todos los</text>
  <text x="540" y="780" text-anchor="middle" font-family="Poppins" font-weight="500" font-size="28" fill="#F5F1E8">bancos y Billeteras Virtuales</text>

  <text x="540" y="832" text-anchor="middle" font-family="Lora" font-style="italic" font-weight="500" font-size="23" letter-spacing="2" fill="#C9A227">Recibimos en Ecuador en los bancos</text>

  ${bankRowsSVG}


</svg>`;
}

</script>
  <script>
    const DEFAULTS = { rate: "1540", noComision: true, percent: 3 };

    async function loadData(){
      try{
        const res = await fetch('data.json', { cache: 'no-store' });
        if(!res.ok) throw new Error('no data.json');
        return await res.json();
      }catch(e){
        return DEFAULTS;
      }
    }

    (async () => {
      await document.fonts.ready;
      const data = await loadData();
      document.getElementById('stage').innerHTML = buildSVG(data);
    })();
  </script>
</body>
</html>
